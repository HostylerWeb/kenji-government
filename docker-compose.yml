services:
  postgres:
    image: postgres:16-alpine
    container_name: kenji-government-postgres
    environment:
      POSTGRES_USER: kenji_government
      POSTGRES_PASSWORD: kenji_government
      POSTGRES_DB: kenji_government
    ports:
      - "5436:5432"
    volumes:
      - kenji_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenji_government -d kenji_government"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kenji-government-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kenji-government-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kenji_minio_data:/data

volumes:
  kenji_postgres_data:
  kenji_minio_data:
